# Run Mini GraphRAG in containers.
# Build and run on Linux so the lancedb dependency (pulled in by graphrag) installs
# via manylinux wheels, avoiding the macOS x86_64 wheel error.
#
# Data persistence: graph/LanceDB data is bind-mounted to ./data (relative to this
# file, i.e. repo root / data when run with -f src/docker/docker-compose.yaml from
# repo root). Data survives container restarts and is visible on the host.

services:
  app:
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/app/data
    volumes:
      # Local mapped volume: persist graph/LanceDB data to host ./data
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Data container: same bind mount so graph/LanceDB data is shared and on the host
  lancedb:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    volumes:
      - ../../data:/data
